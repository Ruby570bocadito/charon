name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build, clippy y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain estable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache de cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        # Los tests de integración requieren un KDC; sin él se saltan solos
        # (kdc_available() sondea con una petición real antes de ejecutarse).
        run: cargo test --workspace

[workspace]
resolver = "2"
members = [
    "crates/asn1",
    "crates/kcrypto",
    "crates/krb5",
    "crates/client",
    "crates/attacks",
    "crates/trace",
    "crates/matrix",
    "crates/charon",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Crates internos del workspace
charon-asn1 = { path = "crates/asn1" }
charon-kcrypto = { path = "crates/kcrypto" }
charon-krb5 = { path = "crates/krb5" }
charon-client = { path = "crates/client" }
charon-attacks = { path = "crates/attacks" }
charon-trace = { path = "crates/trace" }
charon-matrix = { path = "crates/matrix" }
charon = { path = "crates/charon" }

# Primitivos criptográficos auditados (RustCrypto) — ADR-003 prohíbe
# reimplementar primitivos; Charon implementa solo las construcciones
# del protocolo (string-to-key, DK, CTS, checksums) sobre ellos.
aes = "0.9"
hmac = "0.13"
sha1 = "0.11"
md4 = "0.11"
md-5 = "0.11"
rc4 = "0.2"
pbkdf2 = "0.13"
cipher = "0.5"
digest = "0.11"

# Utilidades
getrandom = "0.4"
hex = "0.4"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
owo-colors = "4"

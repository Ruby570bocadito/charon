[workspace]
resolver = "2"
members = [
    "crates/asn1",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Crates internos del workspace
charon-asn1 = { path = "crates/asn1" }

# Primitivos criptográficos auditados (RustCrypto) — ADR-003 prohíbe
# reimplementar primitivos; Charon implementa solo las construcciones
# del protocolo (string-to-key, DK, CTS, checksums) sobre ellos.
aes = "0.8"
hmac = "0.12"
sha1 = "0.10"
md-4 = "0.10"
md-5 = "0.10"
rc4 = "0.1"
pbkdf2 = "0.12"
cipher = "0.4"
digest = "0.10"

# Utilidades
getrandom = "0.2"
hex = "0.4"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
owo-colors = "4"
